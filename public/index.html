<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Mesa · Pedidos</title>
    <link rel="stylesheet" href="/style.css?v=mesa-login-4" />
    <link rel="stylesheet" href="/branding.css?v=mesa-login-4" />
  </head>
  <body>
    <div id="root"></div>

    <div
      class="feedback-backdrop"
      id="feedbackBackdrop"
      aria-hidden="true"
    >
      <section
        class="feedback-modal"
        id="feedbackModal"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="feedbackTitle"
        aria-describedby="feedbackMessage"
        data-type="info"
      >
        <button
          class="feedback-close"
          id="feedbackClose"
          type="button"
          aria-label="Cerrar aviso"
        >
          ×
        </button>
        <div class="feedback-icon" id="feedbackIcon" aria-hidden="true">
          i
        </div>
        <div class="feedback-copy">
          <span class="feedback-kicker" id="feedbackKicker">AVISO</span>
          <h2 id="feedbackTitle">Mensaje</h2>
          <p id="feedbackMessage"></p>
        </div>
        <button
          class="button primary feedback-action"
          id="feedbackAction"
          type="button"
        >
          Entendido
        </button>
      </section>
    </div>

    <div class="backdrop" id="backdrop">
      <section class="modal" role="dialog" aria-modal="true">
        <h2>Nuevo pedido</h2>
        <p>Elegí productos del menú y cargá la dirección de entrega.</p>
        <div id="productChoices"></div>
        <label class="label" for="address">Dirección de entrega</label>
        <input
          class="input"
          id="address"
          placeholder="Calle y altura, barrio"
        />
        <div class="modal-foot">
          <button class="button secondary" id="cancel">Cancelar</button>
          <button class="button primary" id="submitOrder">
            Confirmar pedido
          </button>
        </div>
      </section>
    </div>

    <script>
      const OIDC = {
        issuer: 'http://localhost:8080/realms/delivery',
        clientId: 'mesa-web',
        redirectUri: 'http://localhost:3000/',
      };

      let accessToken = null;
      let idToken = null;
      let user = null;
      let orders = [];
      let catalog = [];
      let filter = 'TODOS';
      let feedbackTimer;

      const root = document.querySelector('#root');
      const backdrop = document.querySelector('#backdrop');

      async function ordersApi(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            ...(options.headers || {}),
            ...(accessToken
              ? { authorization: `Bearer ${accessToken}` }
              : {}),
          },
        });
        const body = await response.json();

        if (!response.ok) {
          const error = new Error(
            body.error || 'No se pudo completar la operación.',
          );
          error.status = response.status;
          throw error;
        }

        return body;
      }

      function base64url(bytes) {
        return btoa(String.fromCharCode(...new Uint8Array(bytes)))
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/g, '');
      }

      async function pkceChallenge(verifier) {
        const digest = await crypto.subtle.digest(
          'SHA-256',
          new TextEncoder().encode(verifier),
        );

        return base64url(digest);
      }

      async function beginLogin() {
        const random = (length) =>
          base64url(crypto.getRandomValues(new Uint8Array(length)));
        const state = random(32);
        const verifier = random(64);

        sessionStorage.setItem('oidc_state', state);
        sessionStorage.setItem('oidc_verifier', verifier);

        const challenge = await pkceChallenge(verifier);
        const authorize = new URL(
          `${OIDC.issuer}/protocol/openid-connect/auth`,
        );

        authorize.search = new URLSearchParams({
          client_id: OIDC.clientId,
          redirect_uri: OIDC.redirectUri,
          response_type: 'code',
          scope: 'openid profile',
          state,
          code_challenge: challenge,
          code_challenge_method: 'S256',
        });

        location.assign(authorize);
      }

      function decodeJwt(jwt) {
        const payload = jwt
          .split('.')[1]
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(payload), (character) =>
          character.charCodeAt(0),
        );

        return JSON.parse(new TextDecoder().decode(bytes));
      }

      async function handleOidcCallback() {
        const params = new URLSearchParams(location.search);
        const code = params.get('code');

        if (params.has('error')) {
          throw new Error(
            params.get('error_description') || params.get('error'),
          );
        }

        if (!code) {
          return false;
        }

        if (params.get('state') !== sessionStorage.getItem('oidc_state')) {
          throw new Error(
            'State OIDC inválido. Volvé a iniciar sesión.',
          );
        }

        const verifier = sessionStorage.getItem('oidc_verifier');
        const response = await fetch(
          `${OIDC.issuer}/protocol/openid-connect/token`,
          {
            method: 'POST',
            headers: {
              'content-type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
              grant_type: 'authorization_code',
              client_id: OIDC.clientId,
              code,
              redirect_uri: OIDC.redirectUri,
              code_verifier: verifier,
            }),
          },
        );
        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error_description || 'No se pudieron obtener los tokens OIDC.',
          );
        }

        accessToken = data.access_token;
        idToken = data.id_token;

        const claims = decodeJwt(accessToken);
        const roles = claims.realm_access?.roles || [];

        user = {
          name:
            `${claims.given_name || ''} ${claims.family_name || ''}`.trim() ||
            claims.preferred_username,
          role: roles.includes('REPARTIDOR') ? 'REPARTIDOR' : 'CLIENTE',
          username: claims.preferred_username,
        };

        sessionStorage.removeItem('oidc_state');
        sessionStorage.removeItem('oidc_verifier');
        history.replaceState({}, document.title, '/');

        return true;
      }

      async function logout() {
        const idTokenHint = idToken;

        accessToken = null;
        idToken = null;
        user = null;
        orders = [];

        const end = new URL(
          `${OIDC.issuer}/protocol/openid-connect/logout`,
        );

        end.search = new URLSearchParams({
          client_id: OIDC.clientId,
          post_logout_redirect_uri: OIDC.redirectUri,
        });

        if (idTokenHint) {
          end.searchParams.set('id_token_hint', idTokenHint);
        }

        location.assign(end);
      }

      function loginScreen(error = '') {
        root.innerHTML = `
          <main class="login">
            <section class="login-intro">
              <div class="login-brand">
                <img class="login-logo" src="/mesa-logo.png" alt="Mesa Web" />
              </div>
              <span class="login-kicker">PEDIDOS Y DELIVERY</span>
              <h1>Todo tu servicio, en una sola mesa.</h1>
              <div class="login-decoration" aria-hidden="true"></div>
            </section>
            <section class="login-panel">
              <div class="login-form">
                <span class="login-overline">MESA DELIVERY</span>
                <h2>Bienvenido/a</h2>
                <p class="login-subtitle">Ingresá de forma segura con tu cuenta.</p>
                <button class="button primary login-keycloak" id="loginButton">
                  <span class="keycloak-mark" aria-hidden="true">K</span>
                  Ingresar con Keycloak
                  <span class="login-arrow" aria-hidden="true">→</span>
                </button>
                <p class="login-provider">
                  Te redirigiremos a Keycloak para validar tu identidad.
                </p>
                <div class="login-error"></div>
              </div>
              <span class="login-footer">
                Autenticación protegida con OpenID Connect
              </span>
            </section>
          </main>
        `;

        if (error) {
          notice(error, 'error');
        }

        document
          .querySelector('#loginButton')
          .addEventListener('click', () =>
            beginLogin().catch((err) => notice(err.message, 'error')),
          );
      }

      async function refreshOrders() {
        const data = await ordersApi('/api/pedidos');
        orders = data.pedidos;
      }

      function renderApp() {
        const initials = user.name
          .split(' ')
          .map((word) => word[0])
          .join('')
          .slice(0, 2);

        root.innerHTML = `
          <main class="app">
            <header class="nav">
              <img class="brand-logo app-logo" src="/mesa-logo.png" alt="Mesa Web" />
              <div class="nav-side">
                <span class="role-pill">${user.role}</span>
                <span class="avatar">${initials}</span>
                <button class="logout" id="logout">Salir</button>
              </div>
            </header>

            <section class="header">
              <div>
                <h1>Pedidos</h1>
                <p>Revisá el estado de los pedidos y gestioná cada entrega.</p>
              </div>
              <button class="button primary" id="newOrder">
                ＋ Crear pedido
              </button>
            </section>

            <section class="stats">
              <article class="stat">
                <div class="stat-label">Pedidos activos</div>
                <div class="stat-line">
                  <div class="stat-value" id="activeCount">0</div>
                  <span class="stat-mark">▤</span>
                </div>
              </article>
              <article class="stat">
                <div class="stat-label">En camino</div>
                <div class="stat-line">
                  <div class="stat-value" id="routeCount">0</div>
                  <span class="stat-mark">➜</span>
                </div>
              </article>
              <article class="stat">
                <div class="stat-label">Entregados</div>
                <div class="stat-line">
                  <div class="stat-value" id="deliveredCount">0</div>
                  <span class="stat-mark">✓</span>
                </div>
              </article>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>Pedidos recientes</h2>
                <span id="orderCount">— PEDIDOS</span>
              </div>
              <div class="filters">
                <button class="filter active" data-filter="TODOS">Todos</button>
                <button class="filter" data-filter="PENDIENTE">Pendientes</button>
                <button class="filter" data-filter="PREPARANDO">Preparando</button>
                <button class="filter" data-filter="EN CAMINO">En camino</button>
                <button class="filter" data-filter="ENTREGADO">Entregados</button>
                <input class="search" id="search" placeholder="⌕ Buscar pedido" />
              </div>
              <div class="order column-head">
                <span>Pedido</span>
                <span>Entrega</span>
                <span>Total</span>
                <span>Estado</span>
                <span>Acción</span>
              </div>
              <div id="orderList"></div>
            </section>
          </main>
        `;

        document.querySelector('#logout').addEventListener('click', logout);
        document
          .querySelector('#newOrder')
          .addEventListener('click', openNewOrder);
        document
          .querySelector('#cancel')
          .addEventListener('click', closeNewOrder);
        document
          .querySelector('#submitOrder')
          .addEventListener('click', createOrder);

        document.querySelectorAll('.filter').forEach((button) => {
          button.addEventListener('click', () => {
            filter = button.dataset.filter;
            document.querySelectorAll('.filter').forEach((item) => {
              item.classList.toggle('active', item === button);
            });
            renderOrders();
          });
        });

        document
          .querySelector('#search')
          .addEventListener('input', renderOrders);

        renderOrders();
      }

      async function openNewOrder() {
        try {
          const data = await ordersApi('/api/catalogo');

          catalog = data.products;
          showProductChoices();
          backdrop.classList.add('open');
        } catch (error) {
          notice(`${error.message} · HTTP ${error.status || '—'}`, 'error');
        }
      }

      function closeNewOrder() {
        backdrop.classList.remove('open');
      }

      function showProductChoices() {
        document.querySelector('#productChoices').innerHTML = catalog
          .map(
            (product) => `
              <label class="product-choice">
                <span>
                  ${escapeHtml(product.name)}
                  <small>$${product.price.toLocaleString('es-AR')}</small>
                </span>
                <span class="product-availability">Disponible</span>
                <input
                  type="number"
                  min="0"
                  max="10"
                  value="0"
                  data-product="${product.id}"
                  aria-label="Cantidad ${escapeHtml(product.name)}"
                />
              </label>
            `,
          )
          .join('');
      }

      function renderOrders() {
        const list = document.querySelector('#orderList');

        if (!list) {
          return;
        }

        document.querySelector('#activeCount').textContent = orders.filter(
          (order) => order.status !== 'ENTREGADO',
        ).length;
        document.querySelector('#routeCount').textContent = orders.filter(
          (order) => order.status === 'EN CAMINO',
        ).length;
        document.querySelector('#deliveredCount').textContent = orders.filter(
          (order) => order.status === 'ENTREGADO',
        ).length;
        document.querySelector('#orderCount').textContent =
          `${orders.length} PEDIDOS`;

        const query = document.querySelector('#search').value.toLowerCase();
        const shown = orders.filter((order) => {
          const matchesFilter =
            filter === 'TODOS' || order.status === filter;
          const searchable = `${order.id} ${order.customer} ${order.address} ${order.items}`;

          return matchesFilter && searchable.toLowerCase().includes(query);
        });

        if (!shown.length) {
          list.innerHTML = '<div class="empty">No hay pedidos en esta vista.</div>';
          return;
        }

        list.innerHTML = shown
          .map((order) => {
            const action =
              order.status !== 'ENTREGADO'
                ? `<button class="action" data-deliver="${order.id}" ${
                    user.role !== 'REPARTIDOR'
                      ? 'title="Acción exclusiva para REPARTIDOR"'
                      : ''
                  }>Marcar entregado</button>`
                : '<span class="delivered-label">✓ Listo</span>';

            return `
              <article class="order">
                <div class="order-main">
                  <strong>Pedido #${order.id} · ${escapeHtml(order.customer)}</strong>
                  <small>${escapeHtml(order.items)} · ${order.createdAt}</small>
                </div>
                <div class="order-detail">
                  ${escapeHtml(order.address)}
                  <small>
                    ${order.courier
                      ? `Repartidor: ${escapeHtml(order.courier)}`
                      : 'Entrega a domicilio'}
                  </small>
                </div>
                <div class="total">$${Number(order.total).toLocaleString('es-AR')}</div>
                <span class="badge ${statusClass(order.status)}">${order.status}</span>
                <div class="order-actions">${action}</div>
              </article>
            `;
          })
          .join('');

        list.querySelectorAll('[data-deliver]').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              const data = await ordersApi(
                `/api/pedidos/${button.dataset.deliver}/entregado`,
                { method: 'PUT' },
              );

              updateOrder(data.pedido);
              notice(
                `Pedido #${data.pedido.id} marcado como entregado. HTTP 200`,
                'ok',
              );
            } catch (error) {
              notice(
                `${error.message} · HTTP ${error.status || '—'}`,
                'error',
              );
            }
          });
        });
      }

      function updateOrder(updatedOrder) {
        orders = orders.map((order) =>
          order.id === updatedOrder.id ? updatedOrder : order,
        );
        renderOrders();
      }

      async function createOrder() {
        const address = document.querySelector('#address').value.trim();
        const selected = [...document.querySelectorAll('[data-product]')]
          .map((input) => ({
            id: input.dataset.product,
            quantity: Number(input.value),
          }))
          .filter((item) => item.quantity > 0);

        if (!address) {
          return notice('Indicá una dirección de entrega.', 'error');
        }

        if (!selected.length) {
          return notice('Elegí al menos un producto del catálogo.', 'error');
        }

        try {
          const data = await ordersApi('/api/pedidos', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ products: selected, address }),
          });

          orders.unshift(data.pedido);
          closeNewOrder();
          document.querySelector('#address').value = '';
          renderOrders();
          notice(`Pedido #${data.pedido.id} creado. HTTP 201`, 'ok');
        } catch (error) {
          notice(`${error.message} · HTTP ${error.status || '—'}`, 'error');
        }
      }

      function closeNotice() {
        const layer = document.querySelector('#feedbackBackdrop');

        if (!layer) {
          return;
        }

        layer.classList.remove('open');
        layer.setAttribute('aria-hidden', 'true');
        clearTimeout(feedbackTimer);
      }

      function notice(message, type = 'info') {
        const layer = document.querySelector('#feedbackBackdrop');

        if (!layer) {
          return;
        }

        const modal = document.querySelector('#feedbackModal');
        const normalized =
          type === 'ok' || type === 'success'
            ? 'success'
            : type === 'error'
              ? 'error'
              : 'info';
        const messages = {
          error: ['ERROR', 'No se pudo completar', '!', 'Cerrar'],
          success: ['LISTO', 'Operación completada', '✓', 'Continuar'],
          info: ['AVISO', 'Para tener en cuenta', 'i', 'Entendido'],
        };
        const [kicker, title, icon, action] = messages[normalized];

        modal.dataset.type = normalized;
        document.querySelector('#feedbackKicker').textContent = kicker;
        document.querySelector('#feedbackTitle').textContent = title;
        document.querySelector('#feedbackIcon').textContent = icon;
        document.querySelector('#feedbackAction').textContent = action;
        document.querySelector('#feedbackMessage').textContent = message;

        layer.classList.add('open');
        layer.setAttribute('aria-hidden', 'false');
        clearTimeout(feedbackTimer);
        document.querySelector('#feedbackAction').focus();
      }

      document
        .querySelector('#feedbackClose')
        .addEventListener('click', closeNotice);
      document
        .querySelector('#feedbackAction')
        .addEventListener('click', closeNotice);
      document
        .querySelector('#feedbackBackdrop')
        .addEventListener('click', (event) => {
          if (event.target.id === 'feedbackBackdrop') {
            closeNotice();
          }
        });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeNotice();
        }
      });

      function statusClass(status) {
        const classes = {
          PENDIENTE: 'pending',
          PREPARANDO: 'preparing',
          'EN CAMINO': 'ontheway',
          ENTREGADO: 'delivered',
        };

        return classes[status] || 'pending';
      }

      function escapeHtml(value) {
        const replacements = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        };

        return String(value).replace(/[&<>"']/g, (character) =>
          replacements[character],
        );
      }

      (async () => {
        try {
          const returned = await handleOidcCallback();

          if (returned) {
            await refreshOrders();
            renderApp();
          } else {
            loginScreen();
          }
        } catch (error) {
          history.replaceState({}, document.title, '/');
          loginScreen(error.message);
        }
      })();
    </script>
  </body>
</html>
